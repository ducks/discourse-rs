# The one place the Rust version is set: shell.nix builds it with
# oxalica/rust-overlay, CI and the release workflow read it.
[toolchain]
channel = "1.99.0"
components = ["rustfmt", "clippy"]
# The composer preview: the markdown crate built as WebAssembly.
targets = ["wasm32-unknown-unknown"]
profile = "minimal"
