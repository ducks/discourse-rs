name: Test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Two jobs side by side: `make lint` locally is the two of them in a row.
jobs:
  lint:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      # rust-toolchain.toml sets the version for rustup here and for
      # shell.nix locally, so clippy agrees in both places.
      - name: Install Rust
        run: rustup show active-toolchain || rustup toolchain install

      # Keyed on the job, the toolchain and Cargo.lock, falling back to the
      # latest cache when they change, so a dependency bump rebuilds only
      # what changed; stale artifacts are pruned before saving.
      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Format and clippy
        run: make fmt-check clippy

  # Three runners: the write suite (one test, the longest) alone, and the
  # rest split in two by nextest. Each builds the tests itself; only one
  # saves the cache, so they do not race to write the same entry.
  test:
    name: test (${{ matrix.shard.name }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shard:
          - { name: writes, filter: "binary(writes)", partition: "" }
          - { name: rest 1/2, filter: "not binary(writes)", partition: "--partition count:1/2" }
          - { name: rest 2/2, filter: "not binary(writes)", partition: "--partition count:2/2" }

    services:
      # structure.sql needs pgvector for the bundled discourse-ai tables.
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      PGHOST: localhost
      PGUSER: postgres
      PGPASSWORD: postgres
      TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/discourse_rs_test

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        run: rustup show active-toolchain || rustup toolchain install

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          save-if: ${{ matrix.shard.name == 'writes' }}

      # The same nextest as shell.nix carries.
      - name: Install cargo-nextest
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-nextest@0.9.95

      - name: Load vendored Discourse schema
        run: scripts/db-load --force discourse_rs_test

      - name: Test
        run: cargo nextest run --profile ci -E '${{ matrix.shard.filter }}' ${{ matrix.shard.partition }}
