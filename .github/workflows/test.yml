name: Test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# lint and test side by side: `make lint` locally is the two of them in a
# row. browser is `make browser-test`, which lint leaves out.
jobs:
  lint:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      # rust-toolchain.toml sets the version for rustup here and for
      # shell.nix locally, so clippy agrees in both places.
      - name: Install Rust
        run: |
          rustup show active-toolchain || rustup toolchain install
          rustup target add wasm32-unknown-unknown

      # Keyed on the job, the toolchain and Cargo.lock, falling back to the
      # latest cache when they change, so a dependency bump rebuilds only
      # what changed; stale artifacts are pruned before saving.
      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Format and clippy
        run: make fmt-check clippy

  # Every test builds once into a nextest archive (tests/integration.rs
  # makes the integration tests one binary, so it is about 280 MB) and
  # runs in six shares from it.
  build-tests:
    runs-on: ubuntu-latest

    env:
      # One compiler at a time: the lib and its unit-test build each peak
      # near 7.6 GB, and two at once ran the 16 GB runner out of memory
      # (killed, exit 143).
      CARGO_BUILD_JOBS: "1"
      # Reduce compiler/linker memory and artifact size; debug assertions remain enabled.
      CARGO_PROFILE_TEST_DEBUG: "0"

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        run: rustup show active-toolchain || rustup toolchain install

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      # The same nextest as shell.nix carries.
      - name: Install cargo-nextest
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-nextest@0.9.95

      - name: Build the tests
        run: |
          bash scripts/ci-resources &
          monitor_pid=$!
          trap 'kill "$monitor_pid" 2>/dev/null || true; wait "$monitor_pid" 2>/dev/null || true' EXIT
          cargo nextest archive --workspace --archive-file tests.tar.zst

      - uses: actions/upload-artifact@v4
        with:
          name: tests
          path: tests.tar.zst
          retention-days: 1
          # zstd already.
          compression-level: 0

  test:
    name: test (${{ matrix.share }}/6)
    needs: build-tests
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        share: [1, 2, 3, 4, 5, 6]

    services:
      # structure.sql needs pgvector for the bundled discourse-ai tables.
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      LETTER_AVATAR_FONT: /usr/share/fonts/opentype/urw-base35/NimbusSans-Regular.otf
      PGHOST: localhost
      PGUSER: postgres
      PGPASSWORD: postgres
      TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/discourse_rs_test

    steps:
      - uses: actions/checkout@v4

      # The plugin_wasm tests build their guests with cargo as they run.
      - name: Install Rust
        run: |
          rustup show active-toolchain || rustup toolchain install
          rustup target add wasm32-unknown-unknown

      - name: Install cargo-nextest
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-nextest@0.9.95

      - name: Install avatar font
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y fonts-urw-base35
          test -r "$LETTER_AVATAR_FONT"

      - name: Load vendored Discourse schema
        run: scripts/db-load --force discourse_rs_test

      - uses: actions/download-artifact@v4
        with:
          name: tests

      # hash: keeps a test in its share as others are added.
      - name: Test
        run: |
          bash scripts/ci-resources &
          monitor_pid=$!
          trap 'kill "$monitor_pid" 2>/dev/null || true; wait "$monitor_pid" 2>/dev/null || true' EXIT
          cargo nextest run --archive-file tests.tar.zst --workspace-remap . \
            --profile ci --partition hash:${{ matrix.share }}/6

  # The Playwright suite (make browser-test, tests/browser): the server
  # built with rustup as above, booted on a throwaway copy of the loaded
  # schema; Playwright and its Chromium from the flake's browser-test
  # shell (nix/playwright.nix), so the runner and the browsers are the
  # versions nixpkgs pins together and nothing comes from npm.
  browser:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      CARGO_BUILD_JOBS: "1"
      CARGO_PROFILE_DEV_DEBUG: "0"
      LETTER_AVATAR_FONT: /usr/share/fonts/opentype/urw-base35/NimbusSans-Regular.otf
      PGHOST: localhost
      PGUSER: postgres
      PGPASSWORD: postgres
      TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/discourse_rs_test

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        run: rustup show active-toolchain || rustup toolchain install

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Install Nix
        uses: cachix/install-nix-action@v31

      - name: Install avatar font
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y fonts-urw-base35
          test -r "$LETTER_AVATAR_FONT"

      - name: Load vendored Discourse schema
        run: scripts/db-load --force discourse_rs_test

      - name: Browser tests
        run: nix develop .#browser-test --command make browser-test

      - name: Keep the failures' traces
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: browser-test-results
          path: tmp/browser-test-results
          if-no-files-found: ignore
