[package]
name = "discourse-rs"
version = "20261007.0.5"
license = "GPL-3.0-or-later"
edition = "2024"
default-run = "discourse-rs"

[workspace]
members = ["crates/markdown"]

[dependencies]
discourse-markdown = { path = "crates/markdown" }
aes-gcm = "0.10"
askama = "0.14"
unicode-normalization = "0.1"
axum = { version = "0.8", features = ["multipart"] }
base64 = "0.22"
chrono = { version = "0.4", default-features = false, features = ["std"] }
chrono-tz = "0.10"
clap = { version = "4", features = ["derive", "env"] }
form_urlencoded = "1"
futures-util = "0.3"
hmac = "0.12"
html-escape = "0.2"
html5ever = "0.29"
markup5ever_rcdom = "0.5.0-unofficial"
fancy-regex = "0.14"
markdown-it = { version = "0.6", default-features = false }
mdurl = "0.3"
md5 = "0.7"
pbkdf2 = "0.12"
pg-bus = { version = "20261005.0.0", features = ["axum"] }
rand = "0.8"
regex = "1"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
serde_yaml_ng = "0.10"
sha1 = "0.10"
sha2 = "0.10"
similar = "2"
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio", "postgres", "macros", "chrono"] }
subtle = "2"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net", "signal", "fs", "process"] }
tower-http = { version = "0.6", features = ["trace", "fs"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
lettre = { version = "0.11", default-features = false, features = ["smtp-transport", "builder", "tokio1", "tokio1-rustls-tls", "hostname"] }
mail-parser = "0.11"
image = { version = "0.25.10", default-features = false, features = ["png", "jpeg", "gif", "webp"] }
fast_image_resize = { version = "6.1.0", features = ["image"] }
oxipng = { version = "10.2.1", default-features = false }
imagequant = { version = "4.4.1", default-features = false }
kamadak-exif = "0.6.1"

[dev-dependencies]
http-body-util = "0.1"
libtest-mimic = "0.8.2"
tower = { version = "0.5", features = ["util"] }

# Every recorded write case is a test of its own (tests/writes.rs).
[[test]]
name = "writes"
harness = false

# PBKDF2 at 600k iterations (Discourse's password hashing) is unusable
# unoptimized; keep the crypto fast in debug builds and tests.
[profile.dev.package.sha2]
opt-level = 3
[profile.dev.package.pbkdf2]
opt-level = 3
[profile.dev.package.hmac]
opt-level = 3
[profile.dev.package.aes-gcm]
opt-level = 3
[profile.dev.package.aes]
opt-level = 3
# Image work (src/images.rs) is slow unoptimized; tests run it.
[profile.dev.package.oxipng]
opt-level = 3
[profile.dev.package.imagequant]
opt-level = 3
[profile.dev.package.fast_image_resize]
opt-level = 3
[profile.dev.package.image]
opt-level = 3
[profile.dev.package.zune-jpeg]
opt-level = 3
[profile.dev.package.png]
opt-level = 3
