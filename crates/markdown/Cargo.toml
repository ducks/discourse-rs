[package]
name = "discourse-markdown"
version = "20261006.0.0"
edition = "2024"
description = "Discourse's markdown renderer (PrettyText's markdown-it), the sanitizer and the emoji data, with no I/O: the server cooks with it, the composer previews with it as WebAssembly."
publish = false

[lib]
crate-type = ["rlib", "cdylib"]

[dependencies]
chrono = { version = "0.4", default-features = false, features = ["std"] }
chrono-tz = "0.10"
fancy-regex = "0.14"
markdown-it = { version = "0.6", default-features = false }
mdurl = "0.3"
md5 = "0.7"
regex = "1"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
