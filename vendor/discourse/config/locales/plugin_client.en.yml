              label: Pinned globally
            pinned_until:
              label: Pinned until
        banner_topic:
          fields:
            topic_id:
              label: Topic ID
            banner_until:
              label: Make banner until
            user:
              label: User
              description: "The user creating the banner (default: system)"
        flag_post_on_words:
          fields:
            words:
              label: Checked words
        topic_required_words:
          fields:
            words:
              label: Required words list
        gift_exchange:
          fields:
            gift_exchangers_group:
              label: Group name of participants
            giftee_assignment_messages:
              label: Messages sent to gifter
        send_pms:
          add_a_pm_btn:
            label: Add a PM
          fields:
            receiver:
              label: PM receiver
            sendable_pms:
              label: PMs
            sender:
              label: PMs sender
              description: "Ensure the sender has the correct permissions to send PMs to receiver"
        close_topic:
          fields:
            topic:
              label: Topic ID
