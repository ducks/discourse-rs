plugin: discourse-assign
enabled_site_setting: assign_enabled
settings:
  discourse_assign:
    assign_enabled:
      default: false
      client: true
    assigns_by_staff_mention: false
    unassign_creates_tracking_post: true
    assigns_public:
      default: false
      client: true
    assign_self_regex: ""
    assign_other_regex: ""
    unassign_on_close: false
    unassign_on_group_archive: false
    reassign_on_open: false
    invite_on_assign: false
    assigns_user_url_path:
      client: true
      default: "/u/{username}/activity/assigned"
    assign_mailer:
      default: "never"
      enum: "AssignMailerSiteSettings"
    remind_assigns_frequency:
      client: true
      enum: "RemindAssignsFrequencySiteSettings"
      default: 0
    pending_assign_reminder_threshold:
      client: true
      default: 2
      min: 1
    max_assigned_topics:
      client: true
      default: 10
      min: 1
    assign_allowed_on_groups:
      client: true
      type: group_list
      list_type: compact
      default: "3"
      allow_any: false
      refresh: true
    enable_assign_status:
      default: false
      client: true
    assign_statuses:
      client: true
      type: list
      default: "New|In Progress|Done"
      allow_any: true
      validator: AssignStatusesValidator
    ignore_solved_topics_in_assigned_reminder:
      default: false
    assignment_status_on_solve:
      type: string
      default: ""
    assignment_status_on_unsolve:
      type: string
      default: ""
  
---
plugin: discourse-cakeday
enabled_site_setting: cakeday_enabled
settings:
  plugins:
    cakeday_enabled:
      default: false
      client: true
    cakeday_emoji:
      default: 'cake'
      client: true
    cakeday_birthday_enabled:
      default: false
      client: true
    cakeday_birthday_emoji:
      default: 'birthday'
      client: true
  
---
plugin: discourse-captcha
enabled_site_setting: discourse_captcha_enabled
settings:
  discourse_captcha:
    discourse_captcha_enabled:
      default: false
      client: true
    discourse_captcha_provider:
      default: "none"
      client: true
      type: enum
      choices:
        - hcaptcha
        - recaptcha
        - none
    hcaptcha_site_key:
      default: ''
      client: true
    hcaptcha_secret_key:
      default: ''
      client: false
      secret: true
    recaptcha_site_key:
      default: ''
      client: true
    recaptcha_secret_key:
      default: ''
      client: false
      secret: true
  
---
plugin: discourse-chat-integration
enabled_site_setting: chat_integration_enabled
settings:
  chat_integration:
    chat_integration_enabled:
      default: false
    chat_integration_discourse_username:
      default: system
      type: username
    chat_integration_delay_seconds:
      default: 20
  
  #######################################
  ########## SLACK SETTINGS #############
  #######################################
    chat_integration_slack_username:
      default: ''
    chat_integration_slack_enabled:
      default: false
      validator: "ChatIntegrationSlackEnabledSettingValidator"
    chat_integration_slack_access_token:
      default: ''
      secret: true
    chat_integration_slack_incoming_webhook_token:
      default: ''
      secret: true
    chat_integration_slack_excerpt_length:
      default: 400
    chat_integration_slack_outbound_webhook_url:
      default: ''
      secret: true
      regex: '^https:\/\/hooks\.slack\.com\/(services|workflows)\/.+$'
    chat_integration_slack_icon_url:
      default: ''
    chat_integration_slack_transcript_quote:
      default: true
  
  #######################################
  ######### TELEGRAM SETTINGS ###########
  #######################################
    chat_integration_telegram_enabled:
      default: false
    chat_integration_telegram_access_token:
      default: ''
      secret: true
    chat_integration_telegram_api_base_url:
      default: 'https://api.telegram.org'
      validator: "ChatIntegrationTelegramApiBaseUrlSettingValidator"
    chat_integration_telegram_excerpt_length:
      default: 400
    chat_integration_telegram_enable_slash_commands:
      default: true
    chat_integration_telegram_secret:
      default: ''
      hidden: true
  
  #######################################
  ########## DISCORD SETTINGS ###########
  #######################################
    chat_integration_discord_enabled:
      default: false
    chat_integration_discord_message_content:
      default: ""
    chat_integration_discord_excerpt_length:
      default: 400
  
  #######################################
  ########## GUILDED SETTINGS ###########
  #######################################
    chat_integration_guilded_enabled:
      default: false
    chat_integration_guilded_excerpt_length:
      default: 400
  
  
  #######################################
  ######## MATTERMOST SETTINGS ##########
  #######################################
    chat_integration_mattermost_enabled:
      default: false
    chat_integration_mattermost_webhook_url:
      default: ''
      secret: true
    chat_integration_mattermost_incoming_webhook_token:
      default: ''
      secret: true
    chat_integration_mattermost_icon_url:
      default: ''
    chat_integration_mattermost_excerpt_length:
      default: 400
  
  #######################################
  ########## MATRIX SETTINGS ############
  #######################################
    chat_integration_matrix_enabled:
      default: false
    chat_integration_matrix_homeserver:
      default: 'https://matrix.org'
    chat_integration_matrix_access_token:
      default: ''
      secret: true
    chat_integration_matrix_excerpt_length:
      default: 400
    chat_integration_matrix_use_notice:
      default: true
  
  #######################################
  ########### ZULIP SETTINGS ############
  #######################################
    chat_integration_zulip_enabled:
      default: false
    chat_integration_zulip_server:
      default: ''
    chat_integration_zulip_bot_email_address:
      default: ''
    chat_integration_zulip_bot_api_key:
      default: ''
      secret: true
    chat_integration_zulip_excerpt_length:
      default: 400
  
  #######################################
  ######## ROCKET CHAT SETTINGS #########
  #######################################
    chat_integration_rocketchat_enabled:
      default: false
    chat_integration_rocketchat_webhook_url:
      default: ''
      secret: true
    chat_integration_rocketchat_excerpt_length:
      default: 400
  
  #######################################
  ########## GITTER SETTINGS ############
  #######################################
    chat_integration_gitter_enabled:
      default: false
  
  #######################################
  ########## GROUPME SETTINGS ##########
  #######################################
    chat_integration_groupme_enabled:
      default: false
    chat_integration_groupme_excerpt_length:
      default: 400
    chat_integration_groupme_bot_ids:
      default: ''
    chat_integration_groupme_instance_names:
      default: ''
  ###########################################
  ######## MICROSOFT TEAMS SETTINGS #########
  ###########################################
    chat_integration_teams_enabled:
      default: false
    chat_integration_teams_excerpt_length:
      default: 400
  ####################################################
  ######## MICROSOFT POWER AUTOMATE SETTINGS #########
  ####################################################
    chat_integration_powerautomate_enabled:
      default: false
    chat_integration_powerautomate_excerpt_length:
      default: 400
  #################################
  ######## WEBEX SETTINGS #########
  #################################
    chat_integration_webex_enabled:
      default: false
    chat_integration_webex_excerpt_length:
      default: 400
  ###########################################
  ########## GOOGLE CHAT SETTINGS ###########
  ###########################################
    chat_integration_google_enabled:
      default: false
    chat_integration_google_excerpt_length:
      default: 100
  
---
plugin: discourse-data-explorer
enabled_site_setting: data_explorer_enabled
settings:
  discourse_data_explorer:
    data_explorer_enabled:
      default: false
      client: true
    data_explorer_ai_queries_enabled:
      default: true
      client: true
      depends_on:
        - discourse_ai_enabled
      depends_behavior: hidden
    data_explorer_query_result_limit:
      default: 1000
      hidden: true
      max: 10000
  
---
plugin: discourse-details
enabled_site_setting: details_enabled
settings:
  plugins:
    details_enabled:
      default: true
      client: true
  
---
plugin: discourse-events
enabled_site_setting: discourse_events_enabled
settings:
  discourse_events:
    discourse_events_enabled:
      default: false
      client: true
    holiday_calendar_topic_id:
      default: ""
      client: true
    holiday_status_emoji:
      client: true
      default: "date"
    delete_expired_event_posts_after:
      min: -1
      default: -1
    all_day_event_start_time:
      default: ""
      client: true
      validator: "DiscourseEvents::Configuration::TimeOfDayValidator"
    all_day_event_end_time:
      default: ""
      client: true
      validator: "DiscourseEvents::Configuration::TimeOfDayValidator"
    calendar_categories:
      type: list
      list_type: simple
      client: true
      default: ""
    calendar_event_display:
      client: true
      default: "auto"
      type: enum
      choices:
        - auto
        - block
        - list-item
    calendar_categories_outlet:
      client: true
      default: "discovery-list-container-top"
      type: enum
      choices:
        - none
        - discovery-list-container-top
        - before-topic-list-body
    working_days:
      type: list
      list_type: simple
      default: Monday|Tuesday|Wednesday|Thursday|Friday
      client: true
    working_day_start_hour:
      default: 8
      client: true
    working_day_end_hour:
      default: 17
      client: true
    close_to_working_day_hours_extension:
      default: 2
      client: true
    calendar_automatic_holidays_enabled: true
    split_grouped_events_by_timezone_threshold:
      default: 0
      client: true
      hidden: true
    event_participation_buttons:
      default: "going|interested|not going"
      client: true
      type: list
      list_type: simple
      allow_any: false
      choices:
        - going
        - interested
        - not going
    discourse_post_event_enabled:
      default: false
      client: true
    discourse_post_event_allowed_on_groups:
      client: true
      type: group_list
      list_type: compact
      default: ""
      allow_any: false
      refresh: true
      mandatory_values: "1|2" # admins, moderators
    displayed_invitees_limit:
      default: 10
      client: false
      max: 25
    display_post_event_date_on_topic_title:
      default: true
      client: true
    use_local_event_date:
      default: false
      client: true
    discourse_post_event_max_bulk_invitees:
      default: 500
      hidden: true
    discourse_post_event_edit_notifications_time_extension:
      default: 0
      min: 0
    discourse_post_event_allowed_custom_fields:
      type: list
      list_type: simple
      client: true
      default: ""
      validator: "DiscourseEvents::Configuration::EventCustomFieldsValidator"
    events_calendar_categories:
      type: category_list
      client: true
      default: ""
    sort_categories_by_event_start_date_enabled:
      default: false
      client: true
    disable_resorting_on_categories_enabled:
      default: false
      client: true
    sidebar_show_upcoming_events:
      default: true
      client: true
    map_events_to_color:
      client: true
      default: "[]"
      json_schema: DiscourseEvents::Configuration::MapEventTagColorsJsonSchema
    map_events_title:
      client: true
      default: ""
      json_schema: DiscourseEvents::Configuration::MapEventsTitleJsonSchema
    calendar_first_day_of_week:
      type: enum
      enum: "DiscourseEvents::Configuration::FirstDayOfWeek"
      default: monday
      client: true
    calendar_upcoming_events_default_view:
      type: enum
      enum: "DiscourseEvents::Configuration::UpcomingEventsDefaultView"
      default: month
      client: true
    enable_events_category_type_setup:
      default: false
      hidden: true
      client: true
      upcoming_change:
        status: "permanent"
        impact: "feature,staff"
        learn_more_url: "https://meta.discourse.org/t/-/401309"
        requires_plugin_enabled: false
    enable_improved_event_reminders:
      default: false
      hidden: true
      client: true
      upcoming_change:
        status: "experimental"
        impact: "feature,all_members"
        learn_more_url: "https://meta.discourse.org/t/-/412427"
    livestream_allowed_hosts:
      type: host_list
      default: "youtube.com|youtu.be|twitch.tv|zoom.us|kick.com|tiktok.com|instagram.com|facebook.com"
      client: true
      hidden: true
      validator: "DiscourseEvents::Livestream::AllowedHostsValidator"
    livestream_zoom_enabled:
      default: false
      client: true
    livestream_zoom_sdk_key:
      default: ""
    livestream_zoom_sdk_secret:
      default: ""
      secret: true
    livestream_embeddable_chat_allowed_paths:
      type: list
      default: "/t"
      client: true
      hidden: true
    livestream_enable_modal_chat_on_mobile:
      default: true
      client: true
  
